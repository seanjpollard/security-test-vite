packages:
  - 'packages/*'
  - 'playground/**'
  - 'packages/**/__tests__/**'
  - docs

hoistPattern:
  - postcss # package/vite
  - pug # playground/tailwind: @vue/compiler-sfc
  - eslint-import-resolver-* # eslint-plugin-import-x
shellEmulator: true
autoInstallPeers: false
dedupeInjectedDeps: false
overrides:
  rolldown: $rolldown
  vite: 'workspace:*'
  debug: 'npm:obug@^1.0.2'
  '@vitest/mocker@4.1.5': '4.1.12' # lockwright: GHSA-82fw-gwwq-j7x9, GHSA-qxg6-89mg-rqv8
  'image-size@0.5.4': '2.0.3' # lockwright: GHSA-5p2g-fcmc-qvqq, GHSA-w3rx-r6r6-pgpr
  'sharp@0.34.5': '0.35.5' # lockwright: GHSA-f88m-g3jw-g9cj, GHSA-rgj7-g3m4-5g8c, GHSA-wq5f-xc86-pv6w
  'tinypool@2.1.0': '2.1.2' # lockwright: GHSA-5gmw-xhrv-c9v3, GHSA-85c8-ppgw-ccpr
  'undici@7.24.8': '7.30.1' # lockwright: GHSA-2gqq-gqf2-x968, GHSA-2jfj-6hjv-fm6j, GHSA-2m5v-pch6-74hx, GHSA-35p6-xmwp-9g52, GHSA-3xpg-4rpp-hhhm, GHSA-4cwx-7wf7-3272, GHSA-4qv8-2p9j-2685, GHSA-4w7w-5xrc-9h26, GHSA-55wc-3pg8-jfw6, GHSA-8436-99hf-9mmv, GHSA-8xcm-r25x-g524, GHSA-9fm3-97px-rjf6, GHSA-f72v-6w45-q472, GHSA-g8m3-5g58-fq7m, GHSA-hm92-r4w5-c3mj, GHSA-jr45-8vmc-qm54, GHSA-m8rv-5g2x-5cg5, GHSA-p88m-4jfj-68fv, GHSA-pmjh-fq2x-6v4x, GHSA-pr7r-676h-xcf6, GHSA-qrxm-fqhp-jwvm, GHSA-r53p-7pc4-xj5r, GHSA-rfgv-xxqx-mfg5, GHSA-rx4f-c7p8-82vq, GHSA-v3r7-h72x-cjcm, GHSA-vmh5-mc38-953g, GHSA-vxpw-j846-p89q, GHSA-w293-vg96-wgc3, GHSA-xjj6-f33q-929c
  'ws@8.18.0': '8.21.0' # lockwright: GHSA-58qx-3vcg-4xpx, GHSA-96hv-2xvq-fx4p
patchedDependencies:
  "sirv@3.0.2": "patches/sirv@3.0.2.patch"
  "chokidar@3.6.0": "patches/chokidar@3.6.0.patch"
  "dotenv-expand@13.0.0": "patches/dotenv-expand@13.0.0.patch"
peerDependencyRules:
  allowedVersions:
    vite: "*"
packageExtensions:
  sass-embedded:
    peerDependencies:
      source-map-js: "*"
    peerDependenciesMeta:
      source-map-js:
        optional: true
  '@rollup/plugin-dynamic-import-vars':
    dependencies:
      '@types/estree': ^1.0.0
allowBuilds:
  core-js: false
  vue-demi: false
  "@parcel/watcher": true
  "@tailwindcss/oxide": true
  esbuild: true
  playwright-chromium: true
  sharp: true
  simple-git-hooks: true
  unrs-resolver: true
  workerd: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3 # https://github.com/paulmillr/chokidar/issues/1440
  - semver@5.7.2 || 6.3.1
  - tailwindcss@3.4.18
  - undici-types@6.21.0 # https://github.com/nodejs/undici/issues/4666

dedupePeers: true
