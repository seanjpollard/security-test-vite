packages:
  - 'packages/*'
  - 'playground/**'
  - 'packages/**/__tests__/**'
  # test fixture that needs to be detected as its own workspace root
  - '!packages/vite/src/node/server/__tests__/fixtures/pnpm'
  - docs

hoistPattern:
  - postcss # package/vite
  - pug # playground/tailwind: @vue/compiler-sfc
shellEmulator: true
autoInstallPeers: false
dedupeInjectedDeps: false
overrides:
  vite: 'workspace:*'
  debug: 'npm:obug@^1.0.2'
  # Volar uses the TypeScript 6 compiler API; its broad optional peer includes TS 7.
  '@volar/typescript>typescript@>=7': '-'
  '@volar/language-service>typescript@>=7': '-'
  '@vue/server-renderer@3.4.38': '3.5.42' # lockwright: GHSA-g2v6-rqmx-r4w6
  'sharp@0.35.2': '0.35.5' # lockwright: GHSA-rgj7-g3m4-5g8c, GHSA-wq5f-xc86-pv6w
  'undici@7.28.0': '7.30.1' # lockwright: GHSA-2gqq-gqf2-x968, GHSA-2jfj-6hjv-fm6j, GHSA-2m5v-pch6-74hx, GHSA-3wwx-pv8p-q78v, GHSA-3xpg-4rpp-hhhm, GHSA-4cwx-7wf7-3272, GHSA-4qv8-2p9j-2685, GHSA-4w7w-5xrc-9h26, GHSA-55wc-3pg8-jfw6, GHSA-8436-99hf-9mmv, GHSA-8xcm-r25x-g524, GHSA-9fm3-97px-rjf6, GHSA-f72v-6w45-q472, GHSA-jr45-8vmc-qm54, GHSA-m8rv-5g2x-5cg5, GHSA-pmjh-fq2x-6v4x, GHSA-qrxm-fqhp-jwvm, GHSA-r53p-7pc4-xj5r, GHSA-rfgv-xxqx-mfg5, GHSA-rx4f-c7p8-82vq, GHSA-v3r7-h72x-cjcm, GHSA-w293-vg96-wgc3, GHSA-xjj6-f33q-929c
patchedDependencies:
  "sirv@3.0.2": "patches/sirv@3.0.2.patch"
  "chokidar@3.6.0": "patches/chokidar@3.6.0.patch"
  "dotenv-expand@13.0.0": "patches/dotenv-expand@13.0.0.patch"
peerDependencyRules:
  allowedVersions:
    vite: "*"
packageExtensions:
  sass-embedded:
    peerDependencies:
      source-map-js: "*"
    peerDependenciesMeta:
      source-map-js:
        optional: true
  '@rollup/plugin-dynamic-import-vars':
    dependencies:
      '@types/estree': ^1.0.0
  '@volar/typescript':
    dependencies:
      '@volar/language-service': 2.4.28
      typescript: ~6.0.3
  '@volar/language-service':
    dependencies:
      typescript: ~6.0.3
  '@vue/compiler-core':
    dependencies:
      '@babel/types': ^7.29.8
  '@vue/compiler-sfc':
    dependencies:
      '@babel/types': ^7.29.8
  '@vue/language-core':
    dependencies:
      '@vue/compiler-sfc': ^3.5.0
      typescript: ~6.0.3
allowBuilds:
  core-js: false
  vue-demi: false
  "@parcel/watcher": true
  "@tailwindcss/oxide": true
  esbuild: true
  playwright-chromium: true
  sharp: true
  simple-git-hooks: true
  unrs-resolver: true
  workerd: true

minimumReleaseAgeStrict: true
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - rolldown
  - '@rolldown/binding-*'
  - '@vitejs/devtools'
  - '@vitejs/devtools-*'
  - napi-windows-process-start-time@0.1.0
trustPolicy: no-downgrade
trustPolicyExcludePrune: true
trustPolicyExclude:
  - semver@6.3.1

dedupePeers: true
