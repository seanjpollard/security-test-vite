packages:
  - 'packages/*'
  - 'playground/**'
  - 'packages/**/__tests__/**'
  - docs

hoistPattern:
  - postcss # package/vite
  - pug # playground/tailwind: @vue/compiler-sfc
  - eslint-import-resolver-* # eslint-plugin-import-x
shellEmulator: true
autoInstallPeers: false
dedupeInjectedDeps: false
overrides:
  rolldown: $rolldown
  vite: 'workspace:*'
  debug: 'npm:obug@^1.0.2'
  'minimatch@3.1.5': '11.0.1' # lockwright: GHSA-23c5-xmqv-rm74, GHSA-3ppc-4f35-3m26, GHSA-7r86-cg39-jmmj, GHSA-g3hv-75wg-m249
  'minimatch@10.2.6': '11.0.1' # lockwright: GHSA-23c5-xmqv-rm74, GHSA-3ppc-4f35-3m26, GHSA-7r86-cg39-jmmj, GHSA-g3hv-75wg-m249
  'minimatch@9.0.9': '11.0.1' # lockwright: GHSA-23c5-xmqv-rm74, GHSA-3ppc-4f35-3m26, GHSA-7r86-cg39-jmmj, GHSA-g3hv-75wg-m249
patchedDependencies:
  "sirv@3.0.2": "patches/sirv@3.0.2.patch"
  "chokidar@3.6.0": "patches/chokidar@3.6.0.patch"
  "dotenv-expand@13.0.0": "patches/dotenv-expand@13.0.0.patch"
peerDependencyRules:
  allowedVersions:
    vite: "*"
packageExtensions:
  sass-embedded:
    peerDependencies:
      source-map-js: "*"
    peerDependenciesMeta:
      source-map-js:
        optional: true
  '@rollup/plugin-dynamic-import-vars':
    dependencies:
      '@types/estree': ^1.0.0
allowBuilds:
  core-js: false
  vue-demi: false
  "@parcel/watcher": true
  "@tailwindcss/oxide": true
  esbuild: true
  playwright-chromium: true
  sharp: true
  simple-git-hooks: true
  unrs-resolver: true
  workerd: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3 # https://github.com/paulmillr/chokidar/issues/1440
  - semver@5.7.2 || 6.3.1
  - tailwindcss@3.4.18
  - undici-types@6.21.0 # https://github.com/nodejs/undici/issues/4666

dedupePeers: true
